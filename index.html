<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carta Santa</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8f5f0; margin: 0; padding-bottom: 80px; }
    header { background: #ffffffcc; position: sticky; top: 0; padding: 12px; border-bottom: 1px solid #ddd; backdrop-filter: blur(8px); z-index: 10; display: flex; justify-content: space-between; align-items: center; }
    #menuBtn { font-size: 28px; background: none; border: none; cursor: pointer; padding: 8px 12px; }
    #menuNav { position: fixed; top: 0; left: -260px; width: 260px; height: 100%; background: #fff; box-shadow: 2px 0 5px rgba(0,0,0,0.2); z-index: 20; padding-top: 60px; transition: left .3s; }
    #menuNav.open { left: 0; }
    #menuNav a { display: block; padding: 15px; border-bottom: 1px solid #eee; color: #333; text-decoration: none; font-size: 16px; }
    .section { padding: 24px 15px; max-width: 700px; margin: auto; }
    .section h2 { text-align: center; border-bottom: 2px solid #555; padding-bottom: 8px; }
    .item { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid #eee; }
    .description { font-size: 13px; color: #666; margin-top: 6px; }
    .add-btn { padding: 8px 12px; background: #17a2b8; color: #fff; border-radius: 6px; border: none; cursor: pointer; margin-top: 8px; }
    #floatBtn { position: fixed; bottom: 20px; right: 20px; background: #25d366; color: white; padding: 14px 20px; border-radius: 50px; font-size: 16px; border: none; display: none; }
    #cartModal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,.6); display:none; }
    #cartContent { position:absolute; bottom:0; left:0; right:0; background:white; border-top-left-radius:20px; border-top-right-radius:20px; padding:20px; max-height:80%; overflow-y:auto; }
    .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #ccc; }
    #sendBtn { width:100%; padding:14px; background:#25d366; color:white; border:none; border-radius:8px; font-size:16px; margin-top:20px; }
  </style>
</head>
<body>
<header>
  <button id="menuBtn" onclick="toggleMenu()">☰</button>
  <img src="logo santa.png" alt="Logo" style="height:40px;" onerror="this.style.display='none'">
</header>
<nav id="menuNav"></nav>
<div id="content"></div>
<button id="floatBtn" onclick="showCartModal()">Finalizar Compra <span id="cartBadge">0</span></button>
<div id="cartModal" onclick="hideCartModal(event)">
  <div id="cartContent">
    <h3>🧺 Tu Pedido</h3>
    <div id="cartItems"></div>
    <div id="total"></div>
    <label>Balneario</label>
    <select id="balneario">
      <option value="">Selecciona</option>
      <option value="Mar del Plata">Mar del Plata</option>
      <option value="La Reina">La Reina</option>
    </select>
    <label>Número Carpa/Sombrilla</label>
    <input id="ubicacion" placeholder="Ej: Carpa 15" />
    <button id="sendBtn" onclick="sendToWhatsApp()">Enviar pedido por WhatsApp</button>
  </div>
</div>
<script>
let cart = [];
let data = {};
const WAPP = "5492235776624";

function toggleMenu(){ document.getElementById('menuNav').classList.toggle('open'); }
function showCartModal(){ document.getElementById('cartModal').style.display='block'; }
function hideCartModal(e){ if(e.target.id==='cartModal') document.getElementById('cartModal').style.display='none'; }

function addToCart(name, price){ cart.push({name, price, quantity:1}); renderCart(); }

function renderCart(){
  const items = document.getElementById('cartItems');
  const badge = document.getElementById('cartBadge');
  const floatBtn = document.getElementById('floatBtn');

  items.innerHTML = '';
  if(cart.length===0){ floatBtn.style.display='none'; badge.innerText='0'; return; }

  floatBtn.style.display='block';
  let total = 0, count = 0;

  cart.forEach((item,i)=>{
    total += item.price * item.quantity;
    count += item.quantity;
    const div = document.createElement('div');
    div.className='cart-item';
    div.innerHTML = `
      <div>${item.name}</div>
      <strong>$${item.price}</strong>
    `;
    items.appendChild(div);
  });

  badge.innerText = count;
  document.getElementById('total').innerHTML = `<strong>Total: $${total}</strong>`;
}

function sendToWhatsApp(){
  if(!cart.length) return;
  const bal = document.getElementById('balneario').value;
  const ubi = document.getElementById('ubicacion').value.trim();
  if(!bal || !ubi){ alert('Completá los datos de entrega'); return; }

  let msg = `Hola! Quería pedir:%0A`;
  cart.forEach(i=> msg += `- ${i.name} ($${i.price})%0A`);
  msg += `%0A📍 Balneario: ${bal}%0ACarpa/Sombrilla: ${ubi}`;

  window.open(`https://wa.me/${WAPP}?text=${msg}`, '_blank');
}

function renderMenu(categories){
  const nav = document.getElementById('menuNav');
  categories.forEach(cat=>{
    const a = document.createElement('a');
    a.href = `#${cat.id}`;
    a.innerText = cat.name;
    a.onclick = toggleMenu;
    nav.appendChild(a);
  });
}

function renderSections(categories){
  const content = document.getElementById('content');
  content.innerHTML = '';
  categories.forEach(cat=>{
    const sec = document.createElement('section');
    sec.className='section';
    sec.id=cat.id;
    sec.innerHTML = `<h2>${cat.name}</h2>`;
    cat.items.forEach(item=>{
      const div = document.createElement('div');
      div.className='item';
      div.innerHTML = `
        <div>
          <strong>${item.name}</strong>
          ${item.description ? `<div class='description'>${item.description}</div>` : ''}
          <button class='add-btn' onclick="addToCart('${item.name}', ${item.price})">Agregar</button>
        </div>
        <strong>$${item.price}</strong>
      `;
      sec.appendChild(div);
    });
    content.appendChild(sec);
  });
}

fetch('products.json')
  .then(r=>r.json())
  .then(json=>{ data=json; renderMenu(json.categories); renderSections(json.categories); })
  .catch(err=>console.error('Error cargando JSON', err));
</script>
</body>
</html>
