<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carta Santa</title>
  <style>
    body { font-family: sans-serif; background: #f8f5f0; margin: 0; padding-bottom: 90px; }
    .section { padding: 24px 15px; max-width: 820px; margin: auto; }
    .item { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #eee; }
    .item-details { flex: 1; }
    .item strong.price { font-size: 16px; color: #222; margin-left: 10px; white-space: nowrap; }
    .description { font-size: 13px; color: #777; margin: 4px 0 8px 0; }
    .add-btn { padding: 8px 10px; background: #17a2b8; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; margin-top: 8px; }
    .section h2 { text-align: center; margin-bottom: 16px; border-bottom: 2px solid #555; padding-bottom: 6px; font-weight: bold; }

    header { background: #ffffffcc; position: sticky; top: 0; backdrop-filter: blur(8px); padding: 12px; border-bottom: 1px solid #ddd; z-index: 20; display:flex; align-items:center; justify-content:space-between; }
    #menuBtn { font-size: 24px; background: none; border: none; cursor: pointer; color: #333; padding: 0 10px; }
    #mainLogo { height: 36px; }

    #menuNav { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #fff; z-index: 30; padding-top: 58px; box-shadow: 2px 0 6px rgba(0,0,0,0.2); transition: left .28s; }
    #menuNav.open { left: 0; }
    #menuNav a { display:block; padding:12px 18px; text-decoration:none; color:#333; border-bottom:1px solid #eee; }

    #floatBtn { position: fixed; bottom: 20px; right: 20px; background: #25d366; color: white; padding: 12px 18px; border: none; border-radius: 50px; font-size: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.18); z-index: 40; display:none; cursor:pointer; }
    #cartBadge { background:red; color:white; border-radius:50%; padding:2px 7px; margin-left:8px; font-weight:bold; font-size:13px; vertical-align:middle; }

    #cartModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display:none; z-index: 50; }
    #cartContent { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; padding: 18px; border-top-left-radius: 16px; border-top-right-radius: 16px; max-height: 86%; overflow-y: auto; }
    .cart-item { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px dashed #ddd; }
    .qty-controls { display:flex; gap:8px; align-items:center; }
    .qty-btn { width:28px; height:28px; border-radius:6px; border:1px solid #ccc; background:#fff; cursor:pointer; }
    .remove-btn { background:none; border:none; color:#cc0000; cursor:pointer; font-size:16px; padding:4px; }

    #total { margin-top:12px; font-weight:bold; font-size:18px; text-align:center; }
    #sendBtn { width:100%; padding:12px; background:#25d366; color:white; border:none; border-radius:8px; font-size:16px; margin-top:12px; cursor:pointer; }

    /* options panel */
    .options-panel { margin-top:10px; border-top:1px dashed #ccc; padding-top:10px; }
    .adicional-label { display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:6px; }

    /* small screens */
    @media (max-width:600px) {
      .section { padding:18px 12px; }
      #menuNav { width: 220px; left: -220px; }
    }
  </style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <button id="menuBtn" onclick="toggleMenu()">☰</button>
    <img id="mainLogo" src="logosanta.png" alt="Logo">
  </div>
</header>

<nav id="menuNav"></nav>

<div id="content"></div>

<button id="floatBtn" onclick="showCartModal()">Finalizar Compra <span id="cartBadge">0</span></button>

<div id="cartModal" onclick="hideCartModal(event)">
  <div id="cartContent">
    <h3 style="margin-top:0;">🧺 Tu Pedido</h3>
    <div id="cartItems"></div>

    <div style="margin-top:12px;">
      <label style="font-weight:600;">Balneario *</label>
      <select id="balneario" style="width:100%; padding:10px; margin-top:6px; border-radius:6px; border:1px solid #ccc;">
        <option value="">Selecciona</option>
        <option value="Mar del Plata">Mar del Plata</option>
        <option value="La Reina">La Reina</option>
      </select>
      <label style="font-weight:600; margin-top:8px; display:block;">Número Carpa/Sombrilla *</label>
      <input id="ubicacion" placeholder="Ej: Carpa 15" style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc; margin-top:6px;">
    </div>

    <div id="total"></div>
    <button id="sendBtn" onclick="sendToWhatsApp()">Enviar Pedido por WhatsApp</button>
    <p style="text-align:center; font-size:12px; color:#777; margin-top:8px;">Toca fuera del cuadro para cerrar</p>
  </div>
</div>

<script>
/* ---------------------------
   Datos / Opciones globales
   --------------------------- */
let cart = [];
let data = {};
const WAPP_NUMBER = '5492235776624';

const ADICIONALES_COMUNES = [
  { name: "Jamón", price: 3000 },
  { name: "Queso", price: 3000 },
  { name: "Huevo", price: 3000 }
];
const ADICIONALES_PREMIUM = [
  { name: "Gambas", price: 4000 },
  { name: "Atún", price: 4000 },
  { name: "Palta", price: 4000 },
  { name: "Palmitos", price: 4000 },
  { name: "Parmesano", price: 4000 },
  { name: "Queso Azul", price: 4000 }
];

const SANDWICH_PANS = ["Árabe","Pebete","Francés"];
const SANDWICH_CATEGORIES = ['sandwiches', 'sandwiches-frios','sandwiches-calientes','vegetarianos'];
const ENSALADA_CATEGORIES = ['ensaladas'];

/* ---------------------------
   Utilidades
   --------------------------- */
function formatPrice(price){
  if (typeof price !== 'number') return `$${price}`;
  return `$${price.toLocaleString('es-AR', {minimumFractionDigits:0})}`;
}

function toggleMenu(){
  document.getElementById('menuNav').classList.toggle('open');
}

/* ---------------------------
   Carrito: agregar / eliminar / render
   --------------------------- */
function addSimpleToCart(baseName, basePrice){
  // simple item (no options)
  cart.push({ name: baseName, baseName, price: basePrice, quantity: 1, notes: ''});
  renderCart();
  showToast(`${baseName} agregado al carrito`);
}
  function updateMenuInfantil(itemId) {
  const plato = document.getElementById(`plato-${itemId}`).value;
  const acom = document.getElementById(`acom-${itemId}`);
  const salsa = document.getElementById(`salsa-${itemId}`);

  if (!plato) {
    acom.style.display = "none";
    salsa.style.display = "none";
    return;
  }

  if (plato === "Pasta seca") {
    acom.style.display = "none";
    salsa.style.display = "block";
  } else {
    salsa.style.display = "none";
    acom.style.display = "block";
  }
}

function handleAddClick(itemId, index, basePrice, categoryId) {
  const panel = document.getElementById(`options-${itemId}`);
  const btn = document.querySelector(`#${itemId}-btn`);

  if (panel) {
    // Si el panel está cerrado → abrirlo y cambiar botón
    if (panel.style.display !== 'block') {
      panel.style.display = 'block';
      btn.innerText = "Agregar al carrito";
      btn.style.background = "#28a745"; // verde "confirmar"
    } 
    // Si ya está abierto → agregar al carrito
    else {
      prepareAndAddToCart(itemId, index, basePrice, categoryId);

      // Restauro el botón
      btn.innerText = "Agregar";
      btn.style.background = "#17a2b8"; // celeste original
    }
  } else {
    // Productos sin opciones → agregar directo
    const cat = data.categories.find(c => c.id === categoryId);
    const item = cat.items[index];
    addSimpleToCart(item.name, item.price);
  }
}


function prepareAndAddToCart(itemId, index, basePrice, categoryId){

  const itemData = data.categories
    .find(c => c.id === categoryId)
    ?.items[index];

  const baseName = itemData.name;
  const itemHasTwoIng = itemData.twoIngredients;

  let finalPrice = basePrice;
  const isSandwich = SANDWICH_CATEGORIES.includes(categoryId);
  const isEnsalada = ENSALADA_CATEGORIES.includes(categoryId);
  const details = [];

  // --- Validar 2 ingredientes ---
  if (itemHasTwoIng) {
    const selected = document.querySelectorAll(`input[name="twoIng-${itemId}"]:checked`);
    if (selected.length !== 2) {
      alert("Debe elegir exactamente 2 ingredientes.");
      return;
    }
    details.push("Ingredientes: " + Array.from(selected).map(s => s.value).join(", "));
  }

  // --- Opciones del JSON ---
  if (itemData.options) {
    for (const optKey in itemData.options) {
      const sel = document.getElementById(`${optKey}-${itemId}`);
      if (!sel || !sel.value) {
        alert(`Por favor seleccioná: ${optKey}`);
        return;
      }
      details.push(`${optKey}: ${sel.value}`);
    }
  }

  // --- Sandwiches ---
  if (isSandwich){
    
    const esTriple = baseName.toLowerCase().includes("triple");

    if (esTriple){
      const tostado = document.getElementById(`tostado-${itemId}`);
      if (tostado.checked) details.push("Tostado");
    } else {
      const pan = document.getElementById(`pan-${itemId}`);
      const tostado = document.getElementById(`tostado-${itemId}`);

      if (!pan || !pan.value){
        alert("Por favor seleccioná el tipo de pan.");
        return;
      }

      details.push(`Pan: ${pan.value}`);
      if (tostado.checked) details.push("Tostado");
    }
  }

  // --- Adicionales ---
  const adics = Array.from(document.querySelectorAll(`#adicionales-${itemId} input[type="checkbox"]:checked`));
  if (adics.length){
    details.push("+ " + adics.map(a => a.value).join(", "));
    adics.forEach(a => finalPrice += parseInt(a.dataset.price));
  }

  // --- Notas ---
  const notes = document.getElementById(`notes-${itemId}`)?.value.trim() || "";

  const nameWithDetails = details.length 
    ? `${baseName} [${details.join(" / ")}]`
    : baseName;

  cart.push({ name: nameWithDetails, price: finalPrice, quantity: 1, notes });

  resetItemOptions(itemId);
  renderCart();
  showToast(`${baseName} agregado al carrito`);
}


function resetItemOptions(itemId){
  const pan = document.getElementById(`pan-${itemId}`);
  if (pan) pan.selectedIndex = 0;
  const tost = document.getElementById(`tostado-${itemId}`);
  if (tost) tost.checked = false;
  const checks = document.querySelectorAll(`#adicionales-${itemId} input[type="checkbox"]`);
  checks.forEach(c => c.checked = false);
  const notes = document.getElementById(`notes-${itemId}`);
  if (notes) notes.value = '';
  const panel = document.getElementById(`options-${itemId}`);
  if (panel) panel.style.display = 'none';
  const btn = document.getElementById(`btn-options-${itemId}`);
  if (btn){ btn.innerText = '➕ Agregar Opciones/Adicionales'; btn.style.background = '#5a6268'; }
}

function changeQuantity(index, delta){
  if (!cart[index]) return;
  cart[index].quantity = Math.max(1, cart[index].quantity + delta);
  renderCart();
}

function removeItem(index){
  if (!cart[index]) return;
  cart.splice(index,1);
  renderCart();
}

function renderCart(){
  const container = document.getElementById('cartItems');
  const totalEl = document.getElementById('total');
  const badge = document.getElementById('cartBadge');
  const floatBtn = document.getElementById('floatBtn');

  container.innerHTML = '';
  if (!cart.length){
    badge.innerText = '0';
    floatBtn.style.display = 'none';
    totalEl.innerHTML = '';
    return;
  }
  floatBtn.style.display = 'block';

  let total = 0;
  let qtySum = 0;
  cart.forEach((item,i)=>{
    const itemTotal = item.price * item.quantity;
    total += itemTotal;
    qtySum += item.quantity;

    const div = document.createElement('div');
    div.className = 'cart-item';
    div.innerHTML = `
      <div style="max-width:70%;">
        <div style="font-weight:600;">${item.name}</div>
        ${item.notes ? `<div style="font-size:13px;color:#666;">"${item.notes}"</div>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="qty-controls">
          <button class="qty-btn" onclick="changeQuantity(${i}, -1)">−</button>
          <span style="min-width:28px; text-align:center;">${item.quantity}</span>
          <button class="qty-btn" onclick="changeQuantity(${i}, 1)">+</button>
        </div>
        <div style="min-width:80px; text-align:right;"><strong>${formatPrice(itemTotal)}</strong></div>
        <button class="remove-btn" onclick="removeItem(${i})">🗑️</button>
      </div>
    `;
    container.appendChild(div);
  });

  totalEl.innerHTML = `<strong>Total: ${formatPrice(total)}</strong>`;
  badge.innerText = qtySum;
}

/* ---------------------------
   Toast pequeño
   --------------------------- */
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.style = "position:fixed;top:80px;right:20px;background:#28a745;color:#fff;padding:10px 14px;border-radius:8px;z-index:9999;box-shadow:0 6px 16px rgba(0,0,0,0.2);";
  t.innerText = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}

/* ---------------------------
   Envío por WhatsApp (valida balneario+ubicacion)
   --------------------------- */
function sendToWhatsApp(){
  if (!cart.length){ showToast('El carrito está vacío'); return; }

  const bal = document.getElementById('balneario').value;
  const ubi = document.getElementById('ubicacion').value.trim();

  if (!bal){ showToast('Por favor seleccioná el balneario'); return; }
  if (!ubi){ showToast('Por favor indicá la carpa/sombrilla'); return; }

  const header = encodeURIComponent("🏖️ ¡Hola! Quiero hacer el siguiente pedido:");
  const delivery = encodeURIComponent(`\n📍 Balneario: ${bal}\n🏖️ Ubicación: ${ubi}\n`);

  const itemsText = cart.map(it=>{
    let line = `- ${it.name}`;
    if (it.quantity > 1) line += ` x${it.quantity}`;
    if (it.notes) line += ` (${it.notes})`;
    line += ` - ${formatPrice(it.price * it.quantity)}`;
    return encodeURIComponent(line);
  }).join("%0A");

  const total = cart.reduce((s,it)=> s + it.price * it.quantity, 0);
  const totalText = encodeURIComponent(`\n💰 Total: ${formatPrice(total)}`);

  // AHORA SÍ — INCLUIMOS DELIVERY
  const message = `${header}%0A%0A${delivery}%0A${itemsText}%0A${totalText}%0A%0A¡Gracias!`;

  const url = `https://wa.me/${WAPP_NUMBER}?text=${message}`;
  window.open(url,'_blank');
}

/* ---------------------------
   Opciones UI (mostrar/ocultar)
   --------------------------- */
function toggleOptions(itemId){
  const panel = document.getElementById(`options-${itemId}`);
  const btn = document.getElementById(`btn-options-${itemId}`);
  if (!panel) return;
  if (panel.style.display === 'block'){
    panel.style.display = 'none';
    if (btn){ btn.innerText = '➕ Agregar Opciones/Adicionales'; btn.style.background='#5a6268'; }
  } else {
    panel.style.display = 'block';
    if (btn){ btn.innerText = '➖ Cerrar Opciones'; btn.style.background='#dc3545'; }
  }
}

/* ---------------------------
   Renderizado del menú desde products.json
   --------------------------- */
function renderMenu(categories){
  const nav = document.getElementById('menuNav');
  nav.innerHTML = '<button onclick="toggleMenu()" style="position:absolute;top:10px;right:10px;font-size:20px;background:none;border:none;cursor:pointer;">✖</button>';
  categories.forEach(cat=>{
    const a = document.createElement('a');
    a.href = `#${cat.id}`;
    a.innerText = cat.name;
    a.onclick = toggleMenu;
    nav.appendChild(a);
  });
}

function renderSections(categories){
  const content = document.getElementById('content');
  content.innerHTML = '';

  categories.forEach((cat)=>{
    const sec = document.createElement('section');
    sec.className = 'section';
    sec.id = cat.id;
    sec.innerHTML = `<h2>${cat.name}</h2>`;

    cat.items.forEach((item, index)=>{
      const itemId = `${cat.id}-${index}`;
      const div = document.createElement('div');
      div.className = 'item';

      const isSandwich = SANDWICH_CATEGORIES.includes(cat.id);
      const isEnsalada = ENSALADA_CATEGORIES.includes(cat.id);
      const hasJsonOptions = item.options && Object.keys(item.options).length > 0;
      const hasAnyOptions = hasJsonOptions || isSandwich || isEnsalada;

      let optionsHtml = '';

      /* -------------------------------------
         PANEL DE OPCIONES (solo si aplica)
      --------------------------------------*/
      if (hasAnyOptions){
        optionsHtml += `<div id="options-${itemId}" class="options-panel" style="display:none;">`;

        /* --- OPCIONES DEL JSON (parte / guarnición / menú infantil) --- */
        if (hasJsonOptions){
          for (const key in item.options){
            const opts = item.options[key];

            if (item.name === "Menú infantil"){

              if (key === "plato"){
                optionsHtml += `
                  <div style="margin-bottom:8px;">
                    <strong>Plato:</strong><br>
                    <select id="plato-${itemId}" onchange="updateMenuInfantil('${itemId}')"
                      style="padding:6px;margin-top:6px;width:100%;">
                      <option value="">Elegir plato</option>
                      ${opts.map(o => `<option value="${o}">${o}</option>`).join('')}
                    </select>
                  </div>
                `;
              }

              if (key === "acompañamiento"){
                optionsHtml += `
                  <div id="acom-${itemId}" style="margin-bottom:8px; display:none;">
                    <strong>Acompañamiento:</strong><br>
                    <select id="acompañamiento-${itemId}" style="padding:6px;margin-top:6px;width:100%;">
                      <option value="">Elegir acompañamiento</option>
                      ${opts.map(o => `<option value="${o}">${o}</option>`).join('')}
                    </select>
                  </div>
                `;
              }

              if (key === "salsa"){
                optionsHtml += `
                  <div id="salsa-${itemId}" style="margin-bottom:8px; display:none;">
                    <strong>Salsa:</strong><br>
                    <select id="salsa-${itemId}" style="padding:6px;margin-top:6px;width:100%;">
                      <option value="">Elegir salsa</option>
                      ${opts.map(o => `<option value="${o}">${o}</option>`).join('')}
                    </select>
                  </div>
                `;
              }

            } else {
              optionsHtml += `
                <div style="margin-bottom:8px;">
                  <strong>${key}:</strong><br>
                  <select id="${key}-${itemId}" style="padding:6px;margin-top:6px;width:100%;">
                    <option value="">Elegir ${key}</option>
                    ${opts.map(o => `<option value="${o}">${o}</option>`).join('')}
                  </select>
                </div>
              `;
            }
          }
        }

        /* --- SANDWICHES: Pan / tostado / 2 ingredientes --- */
        if (isSandwich){

          if (item.twoIngredients){
            const ING = ["Jamón","Queso","Huevo","Tomate","Lechuga"];

            optionsHtml += `
              <div style="margin-bottom:8px;">
                <strong>Elegir 2 ingredientes:</strong>
                <div id="twoIng-${itemId}"
                     style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;">
                  ${ING.map(ing => `
                    <label class="adicional-label">
                      <input type="checkbox" name="twoIng-${itemId}" value="${ing}">
                      ${ing}
                    </label>
                  `).join('')}
                </div>
              </div>
            `;
          }

          const esTriple = item.name.toLowerCase().includes("triple");

          if (esTriple){
            optionsHtml += `
              <div style="margin-bottom:8px;">
                <label><input type="checkbox" id="tostado-${itemId}"> Tostado</label>
              </div>
            `;
          } else {
            optionsHtml += `
              <div style="margin-bottom:8px;">
                <strong>🥖 Pan:</strong><br>
                <select id="pan-${itemId}" style="padding:6px;margin-top:6px;">
                  <option value="">Elegir pan</option>
                  ${SANDWICH_PANS.map(p => `<option value="${p}">${p}</option>`).join('')}
                </select>
                <label style="margin-left:12px;">
                  <input type="checkbox" id="tostado-${itemId}"> Tostado
                </label>
              </div>
            `;
          }
        }

        /* --- ENSALADAS: adicionales --- */
        if (isEnsalada){
          const extra = [...ADICIONALES_COMUNES, ...ADICIONALES_PREMIUM];

          optionsHtml += `
            <div style="font-size:13px;">
              <strong>Extras:</strong>
              <div id="adicionales-${itemId}" 
                  style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;">
                ${extra.map(ad => `
                  <label class="adicional-label">
                    <input type="checkbox" data-price="${ad.price}" value="${ad.name}">
                    ${ad.name} <small>(${formatPrice(ad.price)})</small>
                  </label>
                `).join('')}
              </div>
            </div>
          `;
        }

        /* --- NOTAS --- */
        optionsHtml += `
          <div style="margin-top:8px;">
            <label style="font-size:13px;">Notas:</label><br>
            <input id="notes-${itemId}" placeholder="Ej: sin cebolla"
              style="width:100%;padding:8px;margin-top:6px;border:1px solid #ccc;border-radius:6px;">
          </div>
        `;

        /* --- BOTÓN FINAL AGREGAR --- */
        optionsHtml += `
          <button class="add-btn"
            style="width:100%;margin-top:10px;background:#17a2b8;"
            onclick="prepareAndAddToCart('${itemId}','${item.name.replace(/'/g, "\\'")}',${item.price},'${cat.id}')">
            Agregar
          </button>
        `;

        optionsHtml += `</div>`;
      }

      /* ----------------------------------------------
         BOTÓN ÚNICO DE AGREGAR (SIEMPRE EL MISMO)
      ----------------------------------------------*/
      const mainAddButton = `
        <button class="add-btn" style="margin-top:10px;width:100%;"
          onclick="${hasAnyOptions
            ? `toggleOptions('${itemId}')`
            : `addSimpleToCart('${item.name.replace(/'/g,"\\'")}', ${item.price})`
          }">
          Agregar
        </button>
      `;

      /* RENDER DEL ITEM */
      div.innerHTML = `
        <div class="item-details">
          <strong>${item.name}</strong>
          ${item.description ? `<div class="description">${item.description}</div>` : ''}
          ${mainAddButton}
          ${optionsHtml}
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <strong class="price">${formatPrice(item.price)}</strong>
        </div>
      `;

      sec.appendChild(div);
    });

    content.appendChild(sec);
  });
}


/* ---------------------------
   Carga inicial del JSON y arranque
   --------------------------- */
fetch('products.json')
  .then(res=>{
    if(!res.ok) throw new Error('products.json no encontrado');
    return res.json();
  })
  .then(json=>{
    data = json;
    renderMenu(json.categories || []);
    renderSections(json.categories || []);
    renderCart(); // actualizar carrito si había items en almacenamiento (podemos añadir persistencia luego)
  })
  .catch(err=>{
    console.error(err);
    document.getElementById('content').innerHTML = '<p style="text-align:center;color:#333;">Error cargando productos. Asegurate que <code>products.json</code> esté en la misma carpeta.</p>';
  });

/* ---------------------------
   Cerrar modal al tocar afuera
   --------------------------- */
function showCartModal(){ document.getElementById('cartModal').style.display = 'block'; }
function hideCartModal(e){ if (e.target.id === 'cartModal') document.getElementById('cartModal').style.display = 'none'; }
</script>
